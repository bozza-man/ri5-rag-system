name: Deploy to Pi5 RAG System

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to Pi5
      uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
      with:
        host: ${{ secrets.PI5_HOST }}
        username: ${{ secrets.PI5_USER }}
        key: ${{ secrets.PI5_SSH_KEY }}
        script: |
          set -e
          echo "Starting deployment to Pi5 RAG System..."
          cd /home/pi/ri5-rag-system
          echo "Pulling latest changes..."
          git pull origin main
          echo "Updating dependencies..."
          source .venv/bin/activate
          pip install -r requirements.txt
          echo "Restarting RAG service..."
          sudo systemctl restart pi5-rag-app
          echo "Checking service status..."
          sudo systemctl status pi5-rag-app --no-pager
          echo "Deployment completed successfully!"
